<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>빵그리 로그인 오류</title>
    <meta content="width=device-width, initial-scale=1" name="viewport">

    <link href="https://bbangree-dev-s3.s3.ap-northeast-2.amazonaws.com/logo/logo.svg" rel="icon" type="image/svg+xml">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui,
            Roboto, "Helvetica Neue", "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #fff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .logo img {
            width: 80px;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 20px;
            color: #222;
            margin-bottom: 12px;
        }

        p {
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <img alt="Logo" src="https://bbangree-dev-s3.s3.ap-northeast-2.amazonaws.com/logo/logo.svg">
    </div>
    <h1>로그인 도중 문제가 발생했습니다</h1>
    <p>잠시 후 다시 시도해주세요.</p>
</div>
</body>
</html>
