<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>빵그리의 오븐</title>
    <meta content="width=device-width, initial-scale=1" name="viewport">

    <link href="https://bbangree-dev-s3.s3.ap-northeast-2.amazonaws.com/logo/logo.svg" rel="icon" type="image/svg+xml">
    <link href="https://bbangree-dev-s3.s3.ap-northeast-2.amazonaws.com/logo/logo.ico" rel="alternate icon">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui,
            Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo",
            "Noto Sans KR", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }

        h1 {
            margin-bottom: 16px;
            font-size: 22px;
            color: #222;
        }

        p {
            margin: 8px 0;
            color: #666;
            font-size: 14px;
        }

        .error-code {
            margin-top: 16px;
            padding: 8px 12px;
            background: #f8d7da;
            color: #842029;
            border-radius: 6px;
            font-size: 13px;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">
        <img alt="Logo" src="https://bbangree-dev-s3.s3.ap-northeast-2.amazonaws.com/logo/logo.svg">
    </div>

    <h1>로그인 처리 중 문제가 발생했습니다</h1>

    <p id="message">잠시 후 다시 시도해주세요.</p>

    <div class="error-code" id="errorBox" style="display:none;"></div>
</div>

<script>
    function getErrorParam() {
        const params = new URLSearchParams(window.location.search);
        return params.get("error");
    }

    function setErrorMessage(error) {
        const messageEl = document.getElementById("message");
        const errorBox = document.getElementById("errorBox");

        if (!error) {
            messageEl.innerText = "잘못된 요청입니다.";
            return;
        }

        // 에러 코드별 메시지 매핑
        const errorMessages = {
            NOT_SUPPORTED_SERVER: "지원하지 않는 로그인 서버입니다.",
            MISSING_NAME_NICKNAME: "이름과 닉네임이 전부 비공개 상태입니다.",
            INTERNAL_SERVER_ERROR: "서버 내부에서 에러가 발생했습니다.",
            UNKNOWN_ERROR: "알 수 없는 에러가 발생했습니다.",
            _NOT_SUPPORTED_YET: "아직 지원하지 않는 기능입니다.",
            OAUTH_INVALID_PARAMS: "필수 인증 파라미터가 누락되었습니다."
        };

        messageEl.innerText = errorMessages[error] || "인증 처리 중 오류가 발생했습니다.";
        errorBox.style.display = "inline-block";
        errorBox.innerText = "Error Code : " + error;
    }

    // 실행
    const error = getErrorParam();
    setErrorMessage(error);
</script>

</body>
</html>
